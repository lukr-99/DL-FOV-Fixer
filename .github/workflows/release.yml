name: Release

# The Python 1.x build only. The C# 2.x installer ships from release-windows.yml on v2.* tags.

on:
  push:
    tags:
      - "v1.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        shell: cmd
        run: build.bat

      # PyInstaller output is the case where signing matters most: the bootloader pattern is what
      # Defender heuristics match, so unsigned builds get reported as trojans outright rather than
      # merely warned about. Until a certificate exists this warns and continues; once
      # WINDOWS_CERT_PFX_BASE64 is set it signs and verifies. Add -Require then.
      # See CodePrint docs/release-signing.md.
      - name: Sign executable
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: >-
          ./tools/sign-windows-artifacts.ps1
          -Path 'dist/DL-FOV-Fixer.exe'
          -Description 'DL-FOV-Fixer'
          -DescriptionUrl 'https://github.com/lukr-99/DL-FOV-Fixer'

      - name: Report signing status
        if: always()
        shell: pwsh
        run: |
          # if: always() means this also runs when the build failed, so the file may not exist.
          if (Test-Path 'dist/DL-FOV-Fixer.exe') {
            $status = (Get-AuthenticodeSignature -LiteralPath 'dist/DL-FOV-Fixer.exe').Status
            "DL-FOV-Fixer.exe signature: $status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      # A checksum after signing, since signing changes the file, so users can check their download
      # (README, "Download and the Windows warning"). It is not an .exe, so the 1.0.0 updater,
      # which takes any .exe asset, never picks it.
      - name: Write the SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath 'dist/DL-FOV-Fixer.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('dist/DL-FOV-Fixer.exe.sha256', "$hash  DL-FOV-Fixer.exe`n", [Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/DL-FOV-Fixer.exe
            dist/DL-FOV-Fixer.exe.sha256
          generate_release_notes: true
