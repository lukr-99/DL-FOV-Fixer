name: CI

# Both implementations on every push to main and every pull request. The Python app still ships
# until the C# port passes the shared vectors (docs/csharp-rewrite.md), so both jobs run.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_PATH: DL-FOV-Fixer.slnx

jobs:
  dotnet:
    name: .NET format, build and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore $env:SOLUTION_PATH

      - name: Check formatting
        run: dotnet format $env:SOLUTION_PATH --verify-no-changes --no-restore

      - name: Build
        run: dotnet build $env:SOLUTION_PATH -c Release --no-restore

      - name: Test
        run: >-
          dotnet test --solution $env:SOLUTION_PATH -c Release --no-build
          --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: TestResults/
          if-no-files-found: warn

  python:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest -q
